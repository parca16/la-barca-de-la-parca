<article class="utilities-section">
  <!-- Hero -->
  <div class="page-hero">
    <img
      class="page-hero-bg"
      src="/assets/headers/Utilities_header.webp"
      srcset="/assets/headers/Utilities_header-960.webp 960w, /assets/headers/Utilities_header.webp 1920w"
      sizes="100vw"
      alt="Utilidades por mapa del equipo NTR"
      width="1920"
      height="768"
      fetchpriority="high"
      decoding="async"
    />
    <div class="page-hero-content">
      <h1>UTILIDADES <span class="accent">POR MAPA</span></h1>
      
    </div>
  </div>

  <!-- Mapas -->
  <app-map-pool-grid title="Map Pool Activo" [maps]="activePool" baseRoute="/utilities" />
  <app-map-pool-grid title="Map Pool Inactivo" [maps]="inactivePool" baseRoute="/utilities" />
</article>
