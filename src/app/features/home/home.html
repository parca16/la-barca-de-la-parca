<section class="intro-section">
  <!-- Hero -->
  <div class="page-hero" style="background-image: url('/assets/headers/header-intro.jpg');">
    <div class="page-hero-content">
      <h1>NTR <span class="accent">CS2</span></h1>
      <p class="subtitle">La casa de nuestro equipo</p>
    </div>
  </div>

  <!-- Texto explicativo -->
  <p class="intro-text">
    Esta web pertenece al equipo NTR. Aquí trackeamos las estadísticas de cada uno de los jugadores y
    guardamos todas las estrategias que hemos ido desarrollando a lo largo de los años.
  </p>

  <!-- Grid de mapas -->
  <h2 class="section-label">Selecciona un mapa</h2>
  <div class="map-grid">
    <div class="map-card" style="background-image: url('/assets/maps/Dust 2.jpg');" (click)="navigateToMap('dust-2')">
      <span class="map-card-name">Dust 2</span>
    </div>
    <div class="map-card" style="background-image: url('/assets/maps/Mirage.jpg');" (click)="navigateToMap('mirage')">
      <span class="map-card-name">Mirage</span>
    </div>
    <div class="map-card" style="background-image: url('/assets/maps/Inferno.jpg');" (click)="navigateToMap('inferno')">
      <span class="map-card-name">Inferno</span>
    </div>
    <div class="map-card" style="background-image: url('/assets/maps/Nuke.jpg');" (click)="navigateToMap('nuke')">
      <span class="map-card-name">Nuke</span>
    </div>
    <div class="map-card" style="background-image: url('/assets/maps/Ancient.jpg');" (click)="navigateToMap('ancient')">
      <span class="map-card-name">Ancient</span>
    </div>
    <div class="map-card" style="background-image: url('/assets/maps/Anubis.jpg');" (click)="navigateToMap('anubis')">
      <span class="map-card-name">Anubis</span>
    </div>
  </div>
</section>
