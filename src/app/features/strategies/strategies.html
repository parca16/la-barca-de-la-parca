<article class="strategies-section">
  <!-- Hero -->
  <div class="page-hero page-hero--long-title">
    <img
      class="page-hero-bg"
      src="/assets/headers/Strategies_header.webp"
      srcset="
        /assets/headers/Strategies_header-960.webp  960w,
        /assets/headers/Strategies_header.webp     1248w
      "
      sizes="100vw"
      alt="Estrategias y ejecuciones del equipo NTR"
      width="1248"
      height="697"
      fetchpriority="high"
      decoding="async"
    />
    <div class="page-hero-content">
      <h1>
        ESTRATEGIAS, EJECUCIONES, VARIANTES
        <span>Y ROLES <span class="accent">POR JUGADOR</span></span>
      </h1>
    </div>
  </div>

  <!-- Mapas -->
  <app-map-pool-grid title="Map Pool Activo" [maps]="activePool" baseRoute="/map" />
  <app-map-pool-grid title="Map Pool Inactivo" [maps]="inactivePool" baseRoute="/map" />
</article>
