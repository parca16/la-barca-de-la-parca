<section class="login-page">
  <div class="login-card">
    <span class="login-rule" aria-hidden="true"></span>

    <h1 class="login-title">ACCESO <span class="accent">PRIVADO</span></h1>
    <p class="login-subtitle">
      Contenidos es solo para el equipo NTR. Entra con una cuenta de Google autorizada.
    </p>

    @if (errorMessage(); as message) {
      <p class="login-error" [class.unauthorized]="isUnauthorized()" role="alert">{{ message }}</p>
    }

    @if (auth.user(); as user) {
      <p class="login-session">
        Sesión iniciada como <b>{{ user.email }}</b>
      </p>
      <button class="login-button" type="button" (click)="continueTo()">Ir a Contenidos</button>
    } @else {
      <button class="login-button" type="button" (click)="login()">
        <svg class="login-google" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path
            d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81Z"
          ></path>
        </svg>
        Entrar con Google
      </button>
      <p class="login-footnote">Solo las cuentas autorizadas del equipo pueden ver las clases.</p>
    }
  </div>
</section>
