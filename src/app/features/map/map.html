<div class="map-page">
  <!-- Hero con imagen de cabecera personalizada -->
  <div class="page-hero" [style.backgroundImage]="'url(' + headerImage + ')'">
    <div class="page-hero-content">
      <h1>{{ mapName }}</h1>
      <p class="subtitle">Estrategias y estadísticas</p>
    </div>
  </div>

  <!-- Contenido del mapa -->
  @if (mapKey === 'inferno') {
    <app-inferno-content />
  }
</div>
