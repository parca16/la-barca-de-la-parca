<article class="team-section">
  <!-- Hero -->
  <div class="page-hero">
    <img
      class="page-hero-bg"
      src="/assets/headers/Team_header2.webp"
      srcset="/assets/headers/Team_header2-960.webp 960w, /assets/headers/Team_header2.webp 1376w"
      sizes="100vw"
      alt="El roster de La Barca de la Parca"
      width="1376"
      height="487"
      fetchpriority="high"
      decoding="async"
    />
    <div class="page-hero-content">
      <h1>EL <span class="accent">ROSTER</span></h1>
        </div>
  </div>

  <section class="roster-section">
    <h2 class="roster-title">Titulares</h2>
    <div class="players-grid">
      @for (player of starters; track player.alias) {
        <app-card [player]="player" />
      }
    </div>
  </section>

  <section class="roster-section">
    <h2 class="roster-title">Suplentes</h2>
    <div class="players-grid reserves-grid">
      @for (player of reserves; track player.alias) {
        <app-card [player]="player" />
      }
    </div>
  </section>
</article>
