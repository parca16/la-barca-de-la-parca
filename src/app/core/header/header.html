<header class="header" [class.solid]="isSolid">
  <div class="header-container">
    <a routerLink="" class="logo">
      <img src="/assets/icons/LaBarcaDeLaParca.webp" alt="La Barca de la Parca" width="500" height="500" decoding="async" />
    </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      aria-label="Menú"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="isMenuOpen"
    >
      <span class="hamburger" [class.open]="isMenuOpen" aria-hidden="true"></span>
    </button>

    <nav id="primary-navigation" class="nav" [class.mobile-open]="isMenuOpen" aria-label="Navegación principal">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive
          [routerLinkActiveOptions]="{ exact: item.route === '' }"
          [class.active]="isActive(item.activateOn)"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </div>

  <button
    class="back-to-top"
    type="button"
    [class.visible]="isSolid"
    [attr.aria-hidden]="isSolid ? null : 'true'"
    [attr.tabindex]="isSolid ? null : '-1'"
    (click)="scrollToTop()"
    aria-label="Volver arriba"
  >
    <svg aria-hidden="true" focusable="false" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>
</header>
