<header class="header" [class.solid]="isSolid">
  <div class="header-container">
    <a routerLink="" class="logo">
      <img src="/assets/icons/LaBarcaDeLaParca.png" alt="La Barca de la Parca" />
    </a>

    <button class="menu-toggle" (click)="toggleMenu()" aria-label="Toggle menu">
      <span class="hamburger" [class.open]="isMenuOpen"></span>
    </button>

    <nav class="nav" [class.mobile-open]="isMenuOpen">
      @for (item of navItems; track item.route) {
        <a
          [routerLink]="item.route"
          routerLinkActive
          #active="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: item.route === '' }"
          [class.active]="isActive(item.route, item.activateOn)"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>
      }
    </nav>
  </div>

  <button class="back-to-top" (click)="scrollToTop()" aria-label="Volver arriba">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>
</header>
