<div class="card">
  <div class="card-avatar" [style.borderColor]="player.borderColor">
    <img [src]="player.photoUrl" [alt]="player.alias" loading="lazy" />
  </div>
  <div class="card-info">
    <h3>{{ player.alias }}</h3>
    <span class="role-badge">{{ player.role }}</span>
    @if (player.rating) {
      <div class="player-rating">
        <span class="rating-label">Rating</span>
        <span class="rating-value"> {{ player.rating }}</span>
      </div>
    }
    <p class="player-bio">{{ player.bio }}</p>
  </div>
</div>
